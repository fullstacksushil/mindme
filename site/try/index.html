<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit draws under a phone's notch, padded back by the safe-area insets below. interactive-widget shrinks
     the page when the on-screen keyboard opens, so a focused box stays above it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1016">
<title>Try Mind-Me in your browser</title>
<link rel="icon" href="../img/icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0e1016; color: #d7d7d7; font-family: system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; }
  /* dvh follows a phone's browser bars as they slide away; vh would leave the bottom of the app under them.
     overscroll-behavior stops a drag on the map from pulling the page to refresh. */
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; overscroll-behavior: none;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 1rem; border-bottom: 1px solid #3a3530; font-size: 0.9rem; }
  .bar a { color: #e6b45a; }
  .bar > span:not(:last-child) { color: #96a0b9; }
  /* A phone keeps the links on one short line, so the map gets the height. */
  @media (max-width: 700px) {
    .bar { padding: 0.4rem 0.75rem; font-size: 0.85rem; gap: 0.5rem; }
    .bar .about { display: none; }
    .bar a { padding: 0.35rem 0; }
  }
  /* Phones only: the playground is not built for them yet. Hidden until the script below shows it. */
  .mobile-note { display: none; align-items: center; gap: 0.75rem; padding: 0.5rem 0.75rem; background: #2a2418; color: #e6d2a8;
                 border-bottom: 1px solid #3a3530; font-size: 0.85rem; line-height: 1.35; }
  .mobile-note p { margin: 0; flex: 1; }
  .mobile-note button { flex: none; background: none; border: 0; color: inherit; font-size: 1.4rem; line-height: 1; padding: 0.25rem 0.5rem; cursor: pointer; }
  @media (max-width: 700px), (pointer: coarse) { .mobile-note.shown { display: flex; } }
  /* eframe sizes the canvas to its parent. touch-action gives every touch to the app: a pinch zooms the map, not the page. */
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #96a0b9; }
</style>
<!-- Website visits only, through PostHog. No cookies (memory persistence), no people profiles, no session recordings,
     so a visitor's typed API key in the playground can never be recorded. The app itself sends nothing here. -->
<script>

</head>
<body>
<div class="bar">
  <a href="../">← Mind-Me</a>
  <span class="about">An example map of Atomic Habits. Suggestions come from written ideas until you add your own AI in Settings, Models.</span>
  <span><a href="#" id="reset">Reset<span class="about"> the example</span></a> · <a href="../#get">Get the app</a></span>
</div>
<div class="mobile-note" id="mobile-note" role="status">
  <p>The mobile app is in development. The playground works on a phone, but it is built for a computer for now.</p>
  <button type="button" id="mobile-note-close" aria-label="Dismiss">×</button>
</div>
<main>
  <p id="loading">Loading the playground…</p>
  <canvas id="mindme"></canvas>
</main>
<script type="module">
  import init from "./mindme.js";
  // The app keeps the map under this key, so removing it brings the example back.
  document.getElementById("reset").onclick = e => {
    e.preventDefault();
    if (confirm("Replace your changes with the original example?")) { localStorage.removeItem("map:/Atomic Habits.md"); location.reload(); }
  };
  // The phone banner shows until the visitor closes it once.
  const note = document.getElementById("mobile-note");
  if (localStorage.getItem("mobile-note-closed") !== "1") note.classList.add("shown");
  document.getElementById("mobile-note-close").onclick = () => {
    note.remove();
    localStorage.setItem("mobile-note-closed", "1");
  };
  init().then(() => document.getElementById("loading").remove())
    .catch(e => { document.getElementById("loading").textContent = "The playground could not start: " + e; });
</script>
</body>
</html>
