<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try Mind-Me in your browser</title>
<link rel="icon" href="../img/icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0e1016; color: #d7d7d7; font-family: system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 1rem; border-bottom: 1px solid #3a3530; font-size: 0.9rem; }
  .bar a { color: #e6b45a; }
  .bar > span:not(:last-child) { color: #96a0b9; }
  /* eframe sizes the canvas to its parent. */
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #96a0b9; }
</style>
<!-- Website visits only, through PostHog. No cookies (memory persistence), no people profiles, no session recordings,

</head>
<body>
<div class="bar">
  <a href="../">← Mind-Me</a>
  <span>An example map of Atomic Habits. Suggestions come from written ideas until you add your own AI in Settings, Models.</span>
  <span><a href="#" id="reset">Reset the example</a> · <a href="../#get">Get the app</a></span>
</div>
<main>
  <p id="loading">Loading the playground…</p>
  <canvas id="mindme"></canvas>
</main>
<script type="module">
  import init from "./mindme.js";
  // The app keeps the map under this key, so removing it brings the example back.
  document.getElementById("reset").onclick = e => {
    e.preventDefault();
    if (confirm("Replace your changes with the original example?")) { localStorage.removeItem("map:/Atomic Habits.md"); location.reload(); }
  };
  init().then(() => document.getElementById("loading").remove())
    .catch(e => { document.getElementById("loading").textContent = "The playground could not start: " + e; });
</script>
</body>
</html>
